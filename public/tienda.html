<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tienda</title>

<style>

body{
font-family:Arial, sans-serif;
margin:0;
background:#f5f5f5;
color:#333;
}

/* HEADER */

.header{
text-align:center;
padding:30px 20px;
background:white;
box-shadow:0 3px 10px rgba(0,0,0,0.08);
}

.header h1{
margin:0;
font-size:30px;
}

.eslogan{
color:#777;
margin-top:6px;
font-size:15px;
}

/* PUBLICIDAD */

.publicidad-container{
margin-top:15px;
background:#fff3cd;
border-radius:8px;
overflow:hidden;
height:40px;
display:flex;
align-items:center;
position:relative;
}

.publicidad-texto{
white-space:nowrap;
position:absolute;
font-weight:bold;
animation:publicidad 14s linear infinite;
padding-left:100%;
}

@keyframes publicidad{
0%{transform:translateX(0);}
100%{transform:translateX(-100%);}
}

/* GRID PRODUCTOS */

.productos{
padding:20px;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
gap:20px;
}

/* TARJETA PRODUCTO */

.producto{
background:white;
border-radius:12px;
box-shadow:0 3px 12px rgba(0,0,0,0.12);
padding:12px;
text-align:center;
transition:all .25s ease;
opacity:0;
transform:translateY(20px);
}

.producto.visible{
opacity:1;
transform:translateY(0);
}

.producto:hover{
transform:translateY(-6px);
box-shadow:0 10px 22px rgba(0,0,0,0.18);
}

/* IMAGEN */

.img-container{
position:relative;
}

.producto img{
width:100%;
height:240px;
object-fit:cover;
border-radius:10px;
}

/* ETIQUETAS */

.etiquetaPromo{
position:absolute;
top:10px;
left:10px;
background:#e53935;
color:white;
padding:4px 9px;
font-size:12px;
font-weight:bold;
border-radius:6px;
}

.etiquetaAgotado{
position:absolute;
top:10px;
right:10px;
background:#424242;
color:white;
padding:4px 9px;
font-size:12px;
font-weight:bold;
border-radius:6px;
}

/* AGOTADO */

.producto.agotado{
opacity:.6;
}

.producto.agotado img{
filter:grayscale(100%);
}

.producto.agotado .btn{
background:#aaa;
pointer-events:none;
}

/* NOMBRE */

.nombre{
font-weight:600;
font-size:15px;
margin:10px 0;
min-height:38px;
}

/* PRECIOS */

.precio{
color:#2e7d32;
font-size:20px;
font-weight:bold;
}

.precioViejo{
text-decoration:line-through;
color:#999;
font-size:14px;
}

/* BOTON */

.btn{
display:inline-block;
margin-top:8px;
background:#25D366;
color:white;
padding:9px 14px;
border-radius:7px;
text-decoration:none;
font-size:14px;
}

/* FOOTER */

.footer{
background:#222;
color:white;
padding:35px 20px;
margin-top:40px;
text-align:center;
}

.footer p{
margin:6px 0;
font-size:14px;
}

.credito{
margin-top:15px;
font-size:13px;
opacity:.8;
}

.credito a{
color:#4fc3f7;
text-decoration:none;
}

/* LOADER */

#loader{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:white;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
z-index:9999;
transition:opacity .4s ease;
}

.spinner{
width:50px;
height:50px;
border:5px solid #eee;
border-top:5px solid #25D366;
border-radius:50%;
animation:spin 1s linear infinite;
}

@keyframes spin{
0%{transform:rotate(0)}
100%{transform:rotate(360deg)}
}

</style>
</head>

<body>

<div id="loader">
<div class="spinner"></div>
<p>Cargando tienda...</p>
</div>

<div class="header">
<h1 id="nombreEmpresa"></h1>
<div class="eslogan" id="eslogan"></div>

<div class="publicidad-container">
<div class="publicidad-texto" id="publicidad"></div>
</div>
</div>

<div class="productos" id="productos"></div>

<div class="footer">
<p id="descripcion"></p>
<p id="direccion"></p>
<p id="ciudad"></p>
<p id="telefono"></p>
<p id="correo"></p>

<div class="credito">
Creado por <a href="https://zipy.carrd.co/" target="_blank">Zippy</a>
</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig={
apiKey:"TU_API_KEY",
authDomain:"zippy-727d5.firebaseapp.com",
databaseURL:"https://zippy-727d5-default-rtdb.firebaseio.com",
projectId:"zippy-727d5"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

let productosJson={}
let productosRealtime={}
let telefonoEmpresa=""

const slug=window.location.pathname.split("/").pop()

buscarEmpresa()

function buscarEmpresa(){

const empresasRef=ref(db)

onValue(empresasRef,(snapshot)=>{

snapshot.forEach((child)=>{

const data=child.val()

if(data.perfilempresa?.slug===slug){

const empresaId=child.key
const perfil=data.perfilempresa

telefonoEmpresa=perfil.WhatsApp.replace("+","")

document.getElementById("nombreEmpresa").innerText=perfil.nombreEmpresa
document.getElementById("eslogan").innerText=perfil.eslogan
document.getElementById("publicidad").innerText=perfil.publicidad

document.getElementById("descripcion").innerText=perfil.descripcionEmpresa
document.getElementById("direccion").innerText="Dirección: "+perfil.direccion
document.getElementById("ciudad").innerText="Ciudad: "+perfil.ciudad
document.getElementById("telefono").innerText="WhatsApp: "+perfil.WhatsApp
document.getElementById("correo").innerText="Correo: "+perfil.correo

cargarProductosJSON(perfil.urljason)
escucharCambios(empresaId)

}

})

})

}

function cargarProductosJSON(url){

fetch(url)
.then(res=>res.json())
.then(data=>{
productosJson=data
render()
})

}

function escucharCambios(id){

const productosRef=ref(db,id+"/productos")

onValue(productosRef,(snapshot)=>{

productosRealtime={}

snapshot.forEach((child)=>{
const p=child.val()
productosRealtime[p.referencia]=p
})

render()

})

}

function normalizarImagen(url){

if(!url) return ""

if(url.includes("drive.google.com")){

const match=url.match(/\/d\/([a-zA-Z0-9_-]+)/)||url.match(/[?&]id=([a-zA-Z0-9_-]+)/)

if(match && match[1])
return `https://drive.google.com/thumbnail?id=${match[1]}&sz=w1000`

}

return url

}

function precioCOP(v){
return "$"+v.toString().replace(/\B(?=(\d{3})+(?!\d))/g,".")
}

function render(){

const contenedor=document.getElementById("productos")
contenedor.innerHTML=""

for(const refProducto in productosJson){

const imagen=productosJson[refProducto]
const realtime=productosRealtime[refProducto]

let etiquetaPromo=""
let etiquetaAgotado=""
let claseAgotado=""
let precioHTML=""
let linkWhats=""

if(realtime){

if(realtime.promocion){

precioHTML=`
<div class="precio">${precioCOP(realtime.valorPromocion)}</div>
<div class="precioViejo">${precioCOP(realtime.valor)}</div>
`

etiquetaPromo=`<div class="etiquetaPromo">PROMO</div>`

}else{

precioHTML=`<div class="precio">${precioCOP(realtime.valor)}</div>`

}

if(realtime.agotado){

etiquetaAgotado=`<div class="etiquetaAgotado">AGOTADO</div>`
claseAgotado="agotado"

}

const mensaje=encodeURIComponent("Hola quiero comprar "+refProducto)

linkWhats=`https://wa.me/${telefonoEmpresa}?text=${mensaje}`

}

contenedor.innerHTML+=`

<div class="producto ${claseAgotado}">

<div class="img-container">

${etiquetaPromo}
${etiquetaAgotado}

<img src="${normalizarImagen(imagen)}">

</div>

<div class="nombre">${refProducto}</div>

${precioHTML}

<a class="btn" href="${linkWhats}" target="_blank">Comprar por WhatsApp</a>

</div>

`

}

document.querySelectorAll(".producto").forEach((p,i)=>{
setTimeout(()=>p.classList.add("visible"),i*80)
})

setTimeout(()=>{
document.getElementById("loader").style.opacity="0"
setTimeout(()=>{
document.getElementById("loader").style.display="none"
},400)
},200)

}

</script>

</body>
</html>
