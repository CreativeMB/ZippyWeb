<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tienda</title>

<style>

body{
font-family:Arial;
margin:0;
background:#f4f4f4;
color:#333;
}

.header{
text-align:center;
padding:30px 20px;
background:white;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.header h1{
margin:0;
font-size:28px;
}

.eslogan{
color:#666;
margin-top:5px;
}

.publicidad-container{
margin-top:15px;
background:#ffefc2;
border-radius:8px;
overflow:hidden;
position:relative;
height:40px;
display:flex;
align-items:center;
}

.publicidad-texto{
white-space:nowrap;
font-weight:bold;
position:absolute;
animation: moverPublicidad 15s linear infinite;
padding-left:100%;
}

@keyframes moverPublicidad{

0%{
transform:translateX(0);
}

100%{
transform:translateX(-100%);
}

}

.productos{
padding:20px;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
gap:20px;
}

/* TARJETA PRODUCTO */

.producto{
background:white;
border-radius:12px;
box-shadow:0 3px 8px rgba(0,0,0,0.15);
padding:12px;
text-align:center;
transition:transform .25s ease, box-shadow .25s ease;
opacity:0;
transform:translateY(20px);
}

/* animación cuando aparecen */

.producto.visible{
opacity:1;
transform:translateY(0);
}

/* efecto hover */

.producto:hover{
transform:translateY(-6px);
box-shadow:0 8px 18px rgba(0,0,0,0.25);
}

/* IMAGEN */

.producto img{
width:100%;
height:240px;
object-fit:cover;
border-radius:10px;
margin-bottom:8px;
}

/* NOMBRE */

.nombre{
font-weight:600;
font-size:15px;
margin:8px 0;
min-height:40px;
}

/* PRECIO */

.precio{
color:#2e7d32;
font-size:20px;
font-weight:bold;
}

/* PRECIO ANTERIOR */

.precioViejo{
text-decoration:line-through;
color:#999;
font-size:14px;
margin-top:3px;
}
/* CONTENEDOR IMAGEN */

.img-container{
position:relative;
}

/* ETIQUETA PROMOCION */

.etiquetaPromo{
position:absolute;
top:8px;
left:8px;
background:#e53935;
color:white;
font-size:12px;
font-weight:bold;
padding:4px 8px;
border-radius:6px;
box-shadow:0 2px 6px rgba(0,0,0,0.3);
}

/* ETIQUETA AGOTADO */

.etiquetaAgotado{
position:absolute;
top:8px;
right:8px;
background:#424242;
color:white;
font-size:12px;
font-weight:bold;
padding:4px 8px;
border-radius:6px;
}

/* PRODUCTO AGOTADO */

.producto.agotado{
opacity:0.6;
}

.producto.agotado img{
filter:grayscale(100%);
}

.producto.agotado .btn{
background:#999;
pointer-events:none;
}
.btn{
display:inline-block;
margin-top:8px;
background:#25D366;
color:white;
padding:8px 12px;
border-radius:6px;
text-decoration:none;
font-size:14px;
}

.footer{
background:#222;
color:white;
padding:30px 20px;
margin-top:40px;
}

.footer p{
margin:5px 0;
}

.credito{
margin-top:15px;
font-size:13px;
opacity:0.8;
}

.credito a{
color:#4fc3f7;
text-decoration:none;
}
/* LOADER */

#loader{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:white;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
z-index:9999;
}

.spinner{
width:50px;
height:50px;
border:5px solid #eee;
border-top:5px solid #25D366;
border-radius:50%;
animation:spin 1s linear infinite;
margin-bottom:10px;
}

@keyframes spin{
0%{transform:rotate(0deg);}
100%{transform:rotate(360deg);}
}
</style>

</head>

<body>
  <div id="loader">

<div class="spinner"></div>
<p>Cargando tienda...</p>

</div>

<div class="header">

<h1 id="nombreEmpresa"></h1>
<div class="eslogan" id="eslogan"></div>

<div class="publicidad-container">
    <div class="publicidad-texto" id="publicidad"></div>
</div>

</div>

<div class="productos" id="productos"></div>

<div class="footer">

<p id="descripcion"></p>
<p id="direccion"></p>
<p id="ciudad"></p>
<p id="telefono"></p>
<p id="correo"></p>

<div class="credito">
Creado por 
<a href="https://zipy.carrd.co/" target="_blank">Zippy</a>
</div>


</div>


<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {

apiKey: "TU_API_KEY",
authDomain: "zippy-727d5.firebaseapp.com",
databaseURL: "https://zippy-727d5-default-rtdb.firebaseio.com",
projectId: "zippy-727d5"

};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let productosJson = {};
let productosRealtime = {};
let telefonoEmpresa = "";

const slug = window.location.pathname.split("/").pop();

buscarEmpresa();


function buscarEmpresa(){

const empresasRef = ref(db);

onValue(empresasRef,(snapshot)=>{

snapshot.forEach((child)=>{

const data = child.val();

if(data.perfilempresa?.slug === slug){

const empresaId = child.key;
const perfil = data.perfilempresa;

telefonoEmpresa = perfil.WhatsApp.replace("+","");

document.getElementById("nombreEmpresa").innerText = perfil.nombreEmpresa;
document.getElementById("eslogan").innerText = perfil.eslogan;
document.getElementById("publicidad").innerText = perfil.publicidad;

document.getElementById("descripcion").innerText = perfil.descripcionEmpresa;
document.getElementById("direccion").innerText = "Dirección: " + perfil.direccion;
document.getElementById("ciudad").innerText = "Ciudad: " + perfil.ciudad;
document.getElementById("telefono").innerText = "WhatsApp: " + perfil.WhatsApp;
document.getElementById("correo").innerText = "Correo: " + perfil.correo;

cargarProductosJSON(perfil.urljason);
escucharCambios(empresaId);

}

})

})

}


function cargarProductosJSON(url){

fetch(url)
.then(res=>res.json())
.then(data=>{

productosJson = data;
render();

})

}


function escucharCambios(empresaId){

const productosRef = ref(db, empresaId + "/productos");

onValue(productosRef,(snapshot)=>{

productosRealtime = {};

snapshot.forEach((child)=>{

const p = child.val();
productosRealtime[p.referencia] = p;

});

render();

})

}

function normalizarImagen(url){

if(!url) return "";

if(url.includes("drive.google.com")){

const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/[?&]id=([a-zA-Z0-9_-]+)/);

if(match && match[1]){
return `https://drive.google.com/thumbnail?id=${match[1]}&sz=w1000`;
}

}

return url;

}
function formatearPrecio(valor){
return "$" + valor.toString().replace(/\B(?=(\d{3})+(?!\d))/g,".");
}

function render(){

const contenedor = document.getElementById("productos");
contenedor.innerHTML="";

for(const refProducto in productosJson){

const imagen = productosJson[refProducto];
const realtime = productosRealtime[refProducto];

let etiquetaPromo="";
let etiquetaAgotado="";
let claseAgotado="";

if(realtime){

let precio = realtime.valor;

if(realtime.promocion){

precioHTML=`
<div class="precio">${formatearPrecio(realtime.valorPromocion)}</div>
<div class="precioViejo">${formatearPrecio(realtime.valor)}</div>
`;

precio = realtime.valorPromocion;

etiquetaPromo=`<div class="etiquetaPromo">PROMO</div>`;

}else{

precioHTML=`<div class="precio">${formatearPrecio(realtime.valor)}</div>`;

}

if(realtime.agotado){

etiquetaAgotado=`<div class="etiquetaAgotado">AGOTADO</div>`;
claseAgotado="agotado";

}

const mensaje = encodeURIComponent("Hola quiero comprar " + refProducto);

linkWhats=`https://wa.me/${telefonoEmpresa}?text=${mensaje}`;

}

contenedor.innerHTML+=`

<div class="producto ${claseAgotado}">

<div class="img-container">

${etiquetaPromo}
${etiquetaAgotado}

<img src="${normalizarImagen(imagen)}" loading="lazy">

</div>

<div class="nombre">${refProducto}</div>

${precioHTML}

<a class="btn" href="${linkWhats}" target="_blank">
Comprar por WhatsApp
</a>

</div>

`;

}

}

</script>

</body>
</html>
