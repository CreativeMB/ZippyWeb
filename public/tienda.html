<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Tienda En linea</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        /* ============================= */
        /* GENERAL */
        /* ============================= */
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            background: #f5f6fa;
            color: #333;
        }

 /* ============================= */
/* HEADER MODERNO Y ELEGANTE - TIENDA DE REGALOS */
/* ============================= */
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Poppins:wght@300;400;600&display=swap');
.header {
    text-align: center;
    padding: 50px 20px;
    /* Dirección vertical: de arriba hacia abajo */
    background: linear-gradient(180deg, #000000 0%, #3f3f3f 50%, #6aafa0 100%);
    color: white;
    position: relative;
    overflow: hidden;
}
/* NOMBRE DE LA EMPRESA - ESTILO PREMIUM Y PROFESIONAL */
.header h1 {
    margin: 0;
    font-family: 'Montserrat', sans-serif;
    font-size: 42px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 4px;
    color: #ffffff;
    
    /* Efecto 3D sutil y moderno (sin verse exagerado) */
    text-shadow: 
        2px 2px 0px #15a841,
        4px 4px 10px rgba(65, 55, 55, 0.4),
        0px 0px 20px rgba(26, 25, 25, 0.1);
}

/* ESLOGAN - LEGIBLE, MODERNO Y AMIGABLE */
.eslogan {
    font-family: 'Poppins', sans-serif; /* Tipografía limpia y moderna */
    font-weight: 300; /* Letra delgada para contrastar con el título */
    font-size: 22px; 
    color: #4ea36b; 
    letter-spacing: 1px;
    margin-top: 5px;
    margin-bottom: 25px;
    text-shadow: 1px 1px 4px rgba(0,0,0,0.6);
}

/* CONTENEDOR DE PUBLICIDAD (INFO DESTACADA) */
.banner-informativo {
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 1000px;
    width: 100%;
    
    /* CAMBIOS CLAVE: */
    height: auto;           /* Permite que crezca según el texto */
    min-height: 30px;       /* Un mínimo pequeño para que no desaparezca */
    padding: 10px 0;        /* Margen interno pequeño arriba y abajo */
    overflow: hidden;       /* Evita desbordes si el texto es muy grande */
}
/* TEXTO ANIMADO - IMPACTANTE PERO CLARO */
.texto-destacado {
    font-family: 'Montserrat', sans-serif;
    color: #32ad5b; /* Oro clásico elegante */
    font-weight: 900;
    text-transform: uppercase;
    font-size: 20px;
    letter-spacing: 2px;
    text-align: center;
    
    /* Sombra profesional */
    text-shadow: 2px 2px 5px rgba(0,0,0,0.7);

    animation: drop-3d-header 6s ease-in-out infinite;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    transform-style: preserve-3d;
}

/* ANIMACIÓN (Suavizada para verse más natural) */
@keyframes drop-3d-header {
    0% { opacity: 0; transform: translateY(-20px) rotateX(-45deg); }
    10% { opacity: 1; transform: translateY(0) rotateX(0deg); }
    15% { transform: translateY(-3px); }
    20% { transform: translateY(0); }
    85% { opacity: 1; transform: translateY(0) scale(1.05); }
    95% { opacity: 0; transform: translateY(15px) rotateX(30deg); }
    100% { opacity: 0; }
}

/* ============================= */
/* ESTILO ELEGANTE PARA EL FOOTER */
/* ============================= */
.footer {
    background: #151515; /* Un negro un poco más suave */
    color: white;
    padding: 50px 20px;
    text-align: center;
    border-top: 2px solid #E5C07B; /* Línea decorativa dorada */
}

.info-footer-elegante {
    font-family: 'Poppins', sans-serif; /* Sin cursiva, muy fácil de leer */
    font-weight: 400;
    color: #E5C07B; 
    font-size: 16px; /* Tamaño perfecto para pantallas pequeñas */
    margin: 12px 0;
    letter-spacing: 0.5px;
    line-height: 1.6;
}
/* Ajuste especial para la descripción si es muy larga */
#descripcion.info-footer-elegante {
    font-size: 15px;
    font-weight: 300;
    color: #cccccc; /* Gris claro para diferenciar la descripción del título */
    max-width: 700px;
    margin: 0 auto 20px auto;
}
        /* ============================= */
/* PRODUCTOS GRID PROFESIONAL */
/* ============================= */
.productos {
    padding: 30px 20px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); /* Un poco más anchas para que luzcan */
    gap: 25px; /* Más espacio entre tarjetas */
    min-height: 300px;
}

.producto {
    background: #ffffff;
    border-radius: 20px; /* Bordes más redondeados y modernos */
    border: 1px solid rgba(0,0,0,0.05); /* Un borde casi invisible */
    padding: 15px;
    text-align: center;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* Animación suave */
    opacity: 0;
    transform: translateY(30px);
    box-shadow: 0 5px 15px rgba(0,0,0,0.05);
    position: relative;
    overflow: hidden;
}

/* EFECTO AL PASAR EL MOUSE (HOVER) */
.producto:hover {
    transform: translateY(-10px); /* La tarjeta sube */
    box-shadow: 0 15px 30px rgba(0,0,0,0.12); /* Sombra más profunda */
    border-color: #fbbf24; /* El borde se pone dorado */
}

.producto.visible {
    opacity: 1;
    transform: translateY(0);
}

/* IMAGEN DEL PRODUCTO */
.producto img {
    width: 100%;
    height: 250px;
   object-fit: fill; 
    border-radius: 10px;
    background-color: #eee;
    transition: transform 0.3s ease;
}

.producto:hover img {
    transform: scale(1.05); /* La foto hace un pequeño zoom */
}

/* TEXTOS DENTRO DE LA TARJETA */
.nombre { 
    font-family: 'Montserrat', sans-serif;
    font-weight: 700; 
    margin-top: 15px; 
    font-size: 16px; 
    color: #4e4e4e;
    text-transform: capitalize;
}

.precio { 
    color: #222222; 
    font-size: 22px; 
    font-weight: 800; 
    margin: 8px 0;
}

.precioViejo { 
    text-decoration: line-through; 
    color: #a0a0a0; 
    font-size: 14px; 
    font-weight: 400;
}

/* ETIQUETAS (PROMO Y AGOTADO) */
.etiquetaPromo { 
    position: absolute; 
    top: 15px; 
    left: 15px; 
    background: #e53935; 
    color: white; 
    font-size: 11px; 
    font-weight: bold;
    padding: 5px 12px; 
    border-radius: 50px; /* Estilo píldora */
    z-index: 10;
    box-shadow: 0 4px 8px rgba(229, 57, 53, 0.3);
}

.etiquetaAgotado { 
    position: absolute; 
    top: 15px; 
    right: 15px; 
    background: rgba(0,0,0,0.7); 
    backdrop-filter: blur(5px); /* Efecto cristal traslúcido */
    color: white; 
    font-size: 11px; 
    padding: 5px 12px; 
    border-radius: 50px;
    z-index: 10;
}

/* BOTÓN DE WHATSAPP */
.btn { 
    display: flex; 
    align-items: center;
    justify-content: center;
    margin-top: 15px; 
    background: #25D366; 
    color: white; 
    padding: 12px; 
    border-radius: 12px; 
    text-decoration: none; 
    font-weight: bold;
    font-size: 14px; 
    transition: background 0.3s;
}

.btn:hover {
    background: #1da851;
    box-shadow: 0 4px 12px rgba(37, 211, 102, 0.4);
}
        /* ============================= */
        /* LOADER - BLOQUEO TOTAL */
        /* ============================= */
        #loader {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 99999; /* Por encima de todo */
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 50px; height: 50px;
            border: 5px solid #eee;
            border-top: 5px solid #242424;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* ============================= */
        /* MODAL */
        /* ============================= */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .modal-contenido {
            background: white;
            width: 95%;
            max-width: 500px;
            border-radius: 12px;
            padding: 20px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .formulario input, .formulario textarea, .formulario select {
            width: 100%; padding: 10px; margin: 6px 0;
            border-radius: 6px; border: 1px solid #ccc;
            box-sizing: border-box;
        }

        .fila2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

        #enviarPedidoBtn {
            width: 100%; background: #25D366; color: white;
            border: none; padding: 12px; border-radius: 8px;
            font-size: 16px; cursor: pointer; margin-top: 10px;
        }

        .footer { background: #111; color: white; padding: 30px 20px; text-align: center; }
        .whatsapp { position: fixed; bottom: 20px; right: 20px; background: #25D366; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,.3); z-index: 999; }
        .whatsapp img { width: 32px; }

        @media (max-width:600px) {
            .productos { grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px; }
            .producto img { height: 160px; }
        }
        .aviso-privacidad {
    font-size: 12px; /* Aquí ajustas el tamaño */
    color: #64748b; /* Un gris un poco más claro para que sea discreto */
    line-height: 1.3;
    padding: 8px 12px;
    background-color: #f1f5f9;
    border-left: 3px solid #25D366;
    margin-bottom: 10px;
    border-radius: 4px;
}
    </style>
</head>

<body>

    <div id="loader">
        <div class="spinner"></div>
        <p style="margin-top:15px; font-weight:bold; color:#202020;">Cargando tienda...</p>
    </div>

 <div class="header">

</div>

    <div id="productos" class="productos"></div>

    <div id="modalPedido" class="modal">

            <span style="float:right; cursor:pointer; font-size:24px;" onclick="cerrarModal()">×</span>

    🔒 Tus datos están protegidos y se usan exclusivamente para procesar y entregar tu pedido, conforme a la <strong>Normativa colombiana</strong> de protección de datos.

 <div class="footer">

    <a id="btnWhats" class="whatsapp" target="_blank">
        <img src="https://cdn-icons-png.flaticon.com/512/733/733585.png">
    </a>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, onValue, push, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "zippy-727d5.firebaseapp.com",
            databaseURL: "https://zippy-727d5-default-rtdb.firebaseio.com",
            projectId: "zippy-727d5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let productosJson = {};
        let productosRealtime = {};
        let telefonoEmpresa = "";
        let empresaId = "";
        let idDomiciliarioAsignado = "";
        let productoSeleccionado = "";
        let imagenProducto = "";

        const slug = window.location.pathname.split("/").pop();

        // 1. BUSCAR EMPRESA Y DOMICILIARIO
        const empresasRef = ref(db);
        onValue(empresasRef, (snapshot) => {
            snapshot.forEach((child) => {
                const data = child.val();
                if (data.perfilempresa?.slug === slug) {
                    empresaId = child.key;
                    const perfil = data.perfilempresa;
                    telefonoEmpresa = perfil.WhatsApp.replace("+", "");

                    // Asignar primer domiciliario (Ruta corregida a 'Domiciliarios' con D mayúscula)
                    if (data.Domiciliarios) {
                        idDomiciliarioAsignado = Object.keys(data.Domiciliarios)[0];
                    }

                   // Asignación con verificaciones (Safe Assignment)
// Dentro de tu función de carga de Firebase
document.getElementById("nombreEmpresa").innerText = perfil.nombreEmpresa;
document.getElementById("eslogan").innerText = perfil.eslogan;
document.getElementById("descripcion").innerText = perfil.descripcionEmpresa;
document.getElementById("direccion").innerText = "📍 " + perfil.direccion;
document.getElementById("ciudad").innerText = perfil.ciudad;
document.getElementById("telefono").innerText = "📞 " + perfil.WhatsApp;
document.getElementById("correo").innerText = "✉️ " + perfil.correo;
document.getElementById("info-destacada").innerText = perfil.publicidad;
document.getElementById("btnWhats").href = `https://wa.me/${telefonoEmpresa}`;

                    cargarProductosJSON(perfil.urljason);
                    escucharCambios(empresaId);
                }
            });
        });

        function cargarProductosJSON(url) {
            fetch(url).then(res => res.json()).then(data => {
                productosJson = data;
                render();
            });
        }

        function escucharCambios(id) {
            const productosRef = ref(db, id + "/productos");
            onValue(productosRef, (snapshot) => {
                productosRealtime = {};
                snapshot.forEach((child) => {
                    const p = child.val();
                    productosRealtime[p.referencia] = p;
                });
                render();
            });
        }

       function render() {
    const contenedor = document.getElementById("productos");
    contenedor.innerHTML = "";

    for (const refP in productosJson) {
        const imgUrl = productosJson[refP];
        const real = productosRealtime[refP];
        
        if (!real) continue;

        const card = document.createElement("div");
        card.className = `producto ${real.agotado ? 'agotado' : ''}`;
        
        const precioFinal = real.promocion ? real.valorPromocion : real.valor;
        const precioTexto = formatearPrecio(precioFinal); // Guardamos el precio formateado ($10.000)
        
        const precioHTML = real.promocion ? 
            `<div class="precio">${precioTexto}</div><div class="precioViejo">${formatearPrecio(real.valor)}</div>` : 
            `<div class="precio">${precioTexto}</div>`;

        // LÓGICA DEL BOTÓN Y WHATSAPP CON REFERENCIA Y PRECIO
        let botonHTML = "";
        if (real.agotado) {
            botonHTML = `<div class="btn" style="background:#b2bec3; cursor:not-allowed;">Agotado</div>`;
        } else {
            // MENSAJE PERSONALIZADO: Incluye Nombre y Precio
            const mensajeWa = encodeURIComponent(`Hola, me interesa este producto:\n📌 *Referencia:* ${refP}\n💰 *Precio:* ${precioTexto}\n\n¿Nesesito Informacion?`);
            const linkWa = `https://wa.me/${telefonoEmpresa}?text=${mensajeWa}`;
            
            botonHTML = `<a href="${linkWa}" target="_blank" class="btn" style="background:#25D366; text-decoration:none;">Pedir por WhatsApp</a>`;
        }

        card.innerHTML = `
            <div class="img-container">
                ${real.promocion ? '<div class="etiquetaPromo">PROMO</div>' : ''}
                <img src="${normalizarImagen(imgUrl)}" 
                     ${real.agotado ? "" : `onclick="abrirProducto('${refP}','${imgUrl}','${precioFinal}','${real.descripcion || ""}')"`} 
                     style="${real.agotado ? 'filter: grayscale(100%); opacity: 0.7; cursor:default;' : 'cursor:pointer;'}">
            </div>
            <div class="nombre">${refP}</div>
            ${precioHTML}
            ${botonHTML}
        `;
        contenedor.appendChild(card);
    }

    // Control del Loader para que se quite solo cuando todo está listo
    setTimeout(() => {
        document.querySelectorAll(".producto").forEach((el, i) => {
            setTimeout(() => el.classList.add("visible"), i * 50);
        });
        
        const ld = document.getElementById("loader");
        if(ld){
            ld.style.opacity = "0";
            setTimeout(() => {
                ld.style.display = "none";
            }, 500);
        }
    }, 800);
}

        function abrirProducto(nombre, imagen, precio, descripcion) {
            productoSeleccionado = nombre;
            imagenProducto = normalizarImagen(imagen);
            document.getElementById("productoTitulo").innerText = nombre;
            document.getElementById("productoDescripcion").innerText = descripcion;
            document.getElementById("productoImagen").src = imagenProducto;
            document.getElementById("productoPrecio").innerText = formatearPrecio(precio);
            document.getElementById("modalPedido").style.display = "flex";
        }

        function enviarPedido() {
            const btn = document.getElementById("enviarPedidoBtn");
            const campos = {
                medioPago: document.getElementById("medioPago").value,
                nombreComprador: document.getElementById("nombreComprador").value,
                celularComprador: document.getElementById("celularComprador").value,
                nombreDestinatario: document.getElementById("nombreDestinatario").value,
                celularDestinatario: document.getElementById("celularDestinatario").value,
                direccionEntrega: document.getElementById("direccionEntrega").value,
                notasPedido: document.getElementById("notasPedido").value,
                mensajeTarjeta: document.getElementById("mensajeTarjeta").value,
                deTarjeta: document.getElementById("deTarjeta").value,
                paraTarjeta: document.getElementById("paraTarjeta").value,
                fechaEntrega: document.getElementById("fechaEntrega").value,
                horaEntrega: document.getElementById("horaEntrega").value
            };

            if (Object.values(campos).some(v => !v.trim())) {
                alert("⚠️ Por favor completa todos los campos.");
                return;
            }

            if (!idDomiciliarioAsignado) {
                alert("❌ Error: No hay domiciliarios en el sistema.");
                return;
            }

            btn.disabled = true;
            btn.innerText = "Enviando...";

            const pedidosRef = ref(db, `${empresaId}/Pedidos/${idDomiciliarioAsignado}`);
            
            onValue(pedidosRef, (snapshot) => {
                let maxPos = 0;
                snapshot.forEach(c => { if(c.val().posicion > maxPos) maxPos = c.val().posicion; });

                const nuevoRef = push(pedidosRef);
                const pedidoObj = {
                    idPedido: nuevoRef.key,
                    direccion: campos.direccionEntrega,
                    imagenUrl: imagenProducto,
                    cliente: campos.celularComprador,
                    nombreCliente: campos.nombreComprador,
                    referencia: productoSeleccionado,
                    adicional: document.getElementById("productoAdicional").value,
                    banco: campos.medioPago,
                    destinatario: campos.celularDestinatario,
                    nombreDestinatario: campos.nombreDestinatario,
                    de: campos.deTarjeta,
                    para: campos.paraTarjeta,
                    diaEntrega: campos.fechaEntrega,
                    horaEntrega: campos.horaEntrega,
                    mensaje: campos.mensajeTarjeta,
                    notas: campos.notasPedido,
                    posicion: maxPos + 1,
                    fechaRegistro: new Date().toLocaleDateString(),
                    horaRegistro: new Date().toLocaleTimeString(),
                    notificado: false,
                    color: ""
                };

                set(nuevoRef, pedidoObj).then(() => {
                    alert("✅ Pedido enviado correctamente continuamos por WhatsApp");
                    location.reload();
                });
            }, { onlyOnce: true });
        }

        // Utilidades
        window.cerrarModal = () => document.getElementById("modalPedido").style.display = "none";
        window.abrirProducto = abrirProducto;
        window.enviarPedido = enviarPedido;
        const formatearPrecio = (v) => "$" + v.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        const normalizarImagen = (url) => {
            if (url?.includes("drive.google.com")) {
                const id = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
                return id ? `https://drive.google.com/thumbnail?id=${id[1]}&sz=w1000` : url;
            }
            return url || "";
        };
    </script>
</body>
