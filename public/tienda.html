<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tienda</title>

<style>

body{
font-family: Arial;
margin:0;
background:#f5f5f5;
}

.header{
background:#222;
color:white;
padding:20px;
text-align:center;
}

.productos-grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
gap:20px;
padding:20px;
}

.producto{
background:white;
border-radius:10px;
box-shadow:0 2px 6px rgba(0,0,0,0.2);
padding:10px;
text-align:center;
}

.producto img{
width:100%;
height:150px;
object-fit:cover;
}

.nombre{
font-weight:bold;
margin-top:8px;
}

.precio{
color:green;
font-size:18px;
}

.promocion{
background:red;
color:white;
padding:3px 6px;
border-radius:5px;
font-size:12px;
}

.agotado{
color:red;
font-weight:bold;
}

</style>

</head>

<body>

<header class="header">
<h1 id="nombreEmpresa">Tienda</h1>
</header>

<div id="productos" class="productos-grid"></div>


<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {

apiKey: "TU_API_KEY",
authDomain: "zippy-727d5.firebaseapp.com",
databaseURL: "https://zippy-727d5-default-rtdb.firebaseio.com",
projectId: "zippy-727d5"

};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let productosJson = {};
let productosRealtime = {};

const slug = window.location.pathname.split("/").pop();

buscarEmpresa();



function buscarEmpresa(){

const empresasRef = ref(db);

onValue(empresasRef,(snapshot)=>{

snapshot.forEach((child)=>{

const data = child.val();

if(data.perfilempresa?.slug === slug){

const empresaId = child.key;

cargarProductosJSON(data.perfilempresa.urljason);

escucharCambios(empresaId);

}

})

})

}



function cargarProductosJSON(url){

fetch(url)
.then(res=>res.json())
.then(data=>{

productosJson = data;

render();

})

}



function escucharCambios(empresaId){

const productosRef = ref(db, empresaId + "/productos");

onValue(productosRef,(snapshot)=>{

productosRealtime = {};

snapshot.forEach((child)=>{

const p = child.val();

productosRealtime[p.referencia] = p;

});

render();

})

}



function render(){

const contenedor = document.getElementById("productos");

contenedor.innerHTML="";

for(const refProducto in productosJson){

const imagen = productosJson[refProducto];

const realtime = productosRealtime[refProducto];

let precio = "";
let promo = "";
let agotado = "";

if(realtime){

if(realtime.agotado){

agotado = `<div class="agotado">AGOTADO</div>`;

}else{

if(realtime.promocion){

precio = `<div class="precio">$${realtime.valorPromocion}</div>
<div style="text-decoration:line-through;color:gray">$${realtime.valor}</div>`;

promo = `<div class="promocion">PROMO</div>`;

}else{

precio = `<div class="precio">$${realtime.valor}</div>`;

}

}

}

contenedor.innerHTML += `

<div class="producto">

<img src="${imagen}">

<div class="nombre">${refProducto}</div>

${promo}
${precio}
${agotado}

</div>

`;

}

}

</script>

</body>

</html>
