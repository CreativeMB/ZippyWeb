<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda</title>

    <style>
        /* ============================= */
        /* GENERAL */
        /* ============================= */
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            background: #f5f6fa;
            color: #333;
        }

     /* ============================= */
/* HEADER CON PUBLICIDAD INTEGRADA - FIX NAVEGADOR */
/* ============================= */
.header {
    text-align: center;
    padding: 25px 20px;
    background: linear-gradient(135deg, #181818, #5f5f5f);
    color: white;
    position: relative;
    overflow: hidden;
}

.header h1 {
    margin: 0;
    font-size: 28px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.eslogan {
    opacity: .8;
    margin-top: 4px;
    font-size: 14px;
    margin-bottom: 10px;
}

/* Contenedor corregido */
.publicidad-integrada {
    height: 45px; /* Un poco más de aire */
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 1200px;
    width: 100%;
    position: relative;
    margin-top: 5px;
}

.publicidad-texto {
    color: #fbbf24;
    font-weight: 900;
    text-transform: uppercase;
    font-size: 20px; /* Un poco más grande para PC */
    letter-spacing: 2px;
    width: 100%;
    display: block; /* Forzar renderizado */
    
    /* Efecto 3D con sombras más profundas */
    text-shadow: 
        0 1px 0 #b48608,
        0 2px 0 #8d6906,
        0 4px 8px rgba(0,0,0,0.5);

    /* Propiedades críticas para navegadores Web */
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    transform-style: preserve-3d;
    
    animation: drop-3d-header 6s ease-in-out infinite;
}

/* Animación optimizada para no desaparecer en el inicio */
@keyframes drop-3d-header {
    0% {
        opacity: 0;
        transform: translateY(-20px) rotateX(-70deg); /* Menos rotación inicial */
    }
    10% {
        opacity: 1;
        transform: translateY(0) rotateX(0deg);
    }
    15% {
        transform: translateY(-5px);
    }
    20% {
        transform: translateY(0);
    }
    85% {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
    95% {
        opacity: 0;
        transform: translateY(15px) rotateX(20deg);
    }
    100% {
        opacity: 0;
    }
}
        /* ============================= */
        /* PRODUCTOS GRID */
        /* ============================= */
        .productos {
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 18px;
            min-height: 400px;
        }

        .producto {
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
            padding: 10px;
            text-align: center;
            transition: .25s;
            opacity: 0;
            transform: translateY(20px);
        }

        .producto.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .producto img {
            width: 100%;
            height: 230px;
            object-fit: contain;
            border-radius: 10px;
        }

        .nombre { font-weight: 600; margin-top: 8px; font-size: 15px; }
        .precio { color: #16a34a; font-size: 20px; font-weight: bold; }
        .precioViejo { text-decoration: line-through; color: #999; font-size: 14px; }

        .img-container { position: relative; }
        .etiquetaPromo { position: absolute; top: 8px; left: 8px; background: #e53935; color: white; font-size: 12px; padding: 4px 8px; border-radius: 6px; }
        .etiquetaAgotado { position: absolute; top: 8px; right: 8px; background: #424242; color: white; font-size: 12px; padding: 4px 8px; border-radius: 6px; }

        .btn { display: inline-block; margin-top: 8px; background: #25D366; color: white; padding: 8px 12px; border-radius: 6px; text-decoration: none; font-size: 14px; cursor: pointer; }

        /* ============================= */
        /* LOADER - BLOQUEO TOTAL */
        /* ============================= */
        #loader {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 99999; /* Por encima de todo */
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 50px; height: 50px;
            border: 5px solid #eee;
            border-top: 5px solid #4f46e5;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* ============================= */
        /* MODAL */
        /* ============================= */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .modal-contenido {
            background: white;
            width: 95%;
            max-width: 500px;
            border-radius: 12px;
            padding: 20px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .formulario input, .formulario textarea, .formulario select {
            width: 100%; padding: 10px; margin: 6px 0;
            border-radius: 6px; border: 1px solid #ccc;
            box-sizing: border-box;
        }

        .fila2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

        #enviarPedidoBtn {
            width: 100%; background: #25D366; color: white;
            border: none; padding: 12px; border-radius: 8px;
            font-size: 16px; cursor: pointer; margin-top: 10px;
        }

        .footer { background: #111; color: white; padding: 30px 20px; text-align: center; }
        .whatsapp { position: fixed; bottom: 20px; right: 20px; background: #25D366; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,.3); z-index: 999; }
        .whatsapp img { width: 32px; }

        @media (max-width:600px) {
            .productos { grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px; }
            .producto img { height: 160px; }
        }
    </style>
</head>

<body>

    <div id="loader">
        <div class="spinner"></div>
        <p style="margin-top:15px; font-weight:bold; color:#4f46e5;">Cargando tienda...</p>
    </div>

 <div class="header">
    <h1 id="nombreEmpresa"></h1>
    <div id="eslogan" class="eslogan"></div>
    <div class="banner-informativo">
        <div id="info-destacada" class="texto-destacado"></div>
    </div>
</div>

    <div id="productos" class="productos"></div>

    <div id="modalPedido" class="modal">
        <div class="modal-contenido">
            <span style="float:right; cursor:pointer; font-size:24px;" onclick="cerrarModal()">×</span>
            <div style="display:flex; gap:10px; margin-bottom:15px;">
                <img id="productoImagen" style="width:100px; height:100px; object-fit:contain; background:#f9f9f9; border-radius:8px;">
                <div class="infoProducto">
                    <div id="productoTitulo" style="font-weight:bold;"></div>
                    <div id="productoDescripcion" style="font-size:12px; color:#666;"></div>
                    <div id="productoPrecio" style="font-weight:bold; color:#16a34a; font-size:18px;"></div>
                </div>
            </div>

            <div class="formulario">
                <div class="fila2">
                    <input id="productoAdicional" placeholder="Producto adicional (Opcional)">
                    <select id="medioPago">
                        <option value="">Medio de pago</option>
                         <option>Bre-Be</option>
                        <option>Nequi</option>
                        <option>Bancolombia</option>
                        <option>Daviplata</option>
                        <option>Efectivo</option>
                    </select>
                </div>
                <div class="fila2">
                    <input id="nombreComprador" placeholder="Nombre comprador">
                    <input id="celularComprador" placeholder="Celular comprador">
                </div>
                <div class="fila2">
                    <input id="nombreDestinatario" placeholder="Nombre destinatario">
                    <input id="celularDestinatario" placeholder="Celular destinatario">
                </div>
                <input id="direccionEntrega" placeholder="Dirección entrega">
                <textarea id="notasPedido" placeholder="Notas dirección"></textarea>
                <textarea id="mensajeTarjeta" placeholder="Mensaje tarjeta"></textarea>
                <div class="fila2">
                    <input id="deTarjeta" placeholder="De">
                    <input id="paraTarjeta" placeholder="Para">
                </div>
                <div class="fila2">
                    <input type="date" id="fechaEntrega">
                    <select id="horaEntrega">
                        <option>8AM-10AM</option>
                        <option>10AM-12PM</option>
                        <option>12PM-2PM</option>
                        <option>2PM-4PM</option>
                        <option>4PM-6PM</option>
                        <option>6PM-8PM</option>
                    </select>
                </div>
                <button id="enviarPedidoBtn" onclick="enviarPedido()">Enviar pedido</button>
            </div>
        </div>
    </div>

  <div class="footer">
    <p id="descripcion"></p>
    <p id="direccion"></p>
    <p id="ciudad"></p>
    <p id="telefono"></p>
    <p id="correo"></p>
    <p style="margin-top:25px; font-size:13px; opacity:.8; border-top: 1px solid #333; padding-top: 20px;">
        © 2026 - <a href="https://zipy.carrd.co/" target="_blank" style="color:#fbbf24; text-decoration:none; font-weight:bold;">Creado con Zippy</a>
    </p>
</div>

    <a id="btnWhats" class="whatsapp" target="_blank">
        <img src="https://cdn-icons-png.flaticon.com/512/733/733585.png">
    </a>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, onValue, push, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "zippy-727d5.firebaseapp.com",
            databaseURL: "https://zippy-727d5-default-rtdb.firebaseio.com",
            projectId: "zippy-727d5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let productosJson = {};
        let productosRealtime = {};
        let telefonoEmpresa = "";
        let empresaId = "";
        let idDomiciliarioAsignado = "";
        let productoSeleccionado = "";
        let imagenProducto = "";

        const slug = window.location.pathname.split("/").pop();

        // 1. BUSCAR EMPRESA Y DOMICILIARIO
        const empresasRef = ref(db);
        onValue(empresasRef, (snapshot) => {
            snapshot.forEach((child) => {
                const data = child.val();
                if (data.perfilempresa?.slug === slug) {
                    empresaId = child.key;
                    const perfil = data.perfilempresa;
                    telefonoEmpresa = perfil.WhatsApp.replace("+", "");

                    // Asignar primer domiciliario (Ruta corregida a 'Domiciliarios' con D mayúscula)
                    if (data.Domiciliarios) {
                        idDomiciliarioAsignado = Object.keys(data.Domiciliarios)[0];
                    }

                   // Asignación con verificaciones (Safe Assignment)
// Asignación de textos normales
document.getElementById("nombreEmpresa").innerText = perfil.nombreEmpresa;
document.getElementById("eslogan").innerText = perfil.eslogan;

// Cambio de ID para evitar bloqueadores de anuncios en PC
const campoInfo = document.getElementById("info-destacada");
if (campoInfo) {
    // Usamos exactamente 'publicidad' que es como está en tu Firebase
    campoInfo.innerText = perfil.publicidad || ""; 
    console.log("Dato de Firebase:", perfil.publicidad);
}

document.getElementById("descripcion").innerText = perfil.descripcionEmpresa;

document.getElementById("descripcion").innerText = perfil.descripcionEmpresa;
document.getElementById("direccion").innerText = "Dirección: " + perfil.direccion;
document.getElementById("ciudad").innerText = "Ciudad: " + perfil.ciudad;
document.getElementById("telefono").innerText = "WhatsApp: " + perfil.WhatsApp;
document.getElementById("btnWhats").href = `https://wa.me/${telefonoEmpresa}`;

                    cargarProductosJSON(perfil.urljason);
                    escucharCambios(empresaId);
                }
            });
        });

        function cargarProductosJSON(url) {
            fetch(url).then(res => res.json()).then(data => {
                productosJson = data;
                render();
            });
        }

        function escucharCambios(id) {
            const productosRef = ref(db, id + "/productos");
            onValue(productosRef, (snapshot) => {
                productosRealtime = {};
                snapshot.forEach((child) => {
                    const p = child.val();
                    productosRealtime[p.referencia] = p;
                });
                render();
            });
        }

       function render() {
    const contenedor = document.getElementById("productos");
    contenedor.innerHTML = "";

    for (const refP in productosJson) {
        const imgUrl = productosJson[refP];
        const real = productosRealtime[refP];
        
        if (!real) continue;

        const card = document.createElement("div");
        card.className = `producto ${real.agotado ? 'agotado' : ''}`;
        
        const precioFinal = real.promocion ? real.valorPromocion : real.valor;
        const precioTexto = formatearPrecio(precioFinal); // Guardamos el precio formateado ($10.000)
        
        const precioHTML = real.promocion ? 
            `<div class="precio">${precioTexto}</div><div class="precioViejo">${formatearPrecio(real.valor)}</div>` : 
            `<div class="precio">${precioTexto}</div>`;

        // LÓGICA DEL BOTÓN Y WHATSAPP CON REFERENCIA Y PRECIO
        let botonHTML = "";
        if (real.agotado) {
            botonHTML = `<div class="btn" style="background:#b2bec3; cursor:not-allowed;">Agotado</div>`;
        } else {
            // MENSAJE PERSONALIZADO: Incluye Nombre y Precio
            const mensajeWa = encodeURIComponent(`Hola, me interesa este producto:\n📌 *Referencia:* ${refP}\n💰 *Precio:* ${precioTexto}\n\n¿Nesesito Informacion?`);
            const linkWa = `https://wa.me/${telefonoEmpresa}?text=${mensajeWa}`;
            
            botonHTML = `<a href="${linkWa}" target="_blank" class="btn" style="background:#25D366; text-decoration:none;">Pedir por WhatsApp</a>`;
        }

        card.innerHTML = `
            <div class="img-container">
                ${real.promocion ? '<div class="etiquetaPromo">PROMO</div>' : ''}
                <img src="${normalizarImagen(imgUrl)}" 
                     ${real.agotado ? "" : `onclick="abrirProducto('${refP}','${imgUrl}','${precioFinal}','${real.descripcion || ""}')"`} 
                     style="${real.agotado ? 'filter: grayscale(100%); opacity: 0.7; cursor:default;' : 'cursor:pointer;'}">
            </div>
            <div class="nombre">${refP}</div>
            ${precioHTML}
            ${botonHTML}
        `;
        contenedor.appendChild(card);
    }

    // Control del Loader para que se quite solo cuando todo está listo
    setTimeout(() => {
        document.querySelectorAll(".producto").forEach((el, i) => {
            setTimeout(() => el.classList.add("visible"), i * 50);
        });
        
        const ld = document.getElementById("loader");
        if(ld){
            ld.style.opacity = "0";
            setTimeout(() => {
                ld.style.display = "none";
            }, 500);
        }
    }, 800);
}

        function abrirProducto(nombre, imagen, precio, descripcion) {
            productoSeleccionado = nombre;
            imagenProducto = normalizarImagen(imagen);
            document.getElementById("productoTitulo").innerText = nombre;
            document.getElementById("productoDescripcion").innerText = descripcion;
            document.getElementById("productoImagen").src = imagenProducto;
            document.getElementById("productoPrecio").innerText = formatearPrecio(precio);
            document.getElementById("modalPedido").style.display = "flex";
        }

        function enviarPedido() {
            const btn = document.getElementById("enviarPedidoBtn");
            const campos = {
                medioPago: document.getElementById("medioPago").value,
                nombreComprador: document.getElementById("nombreComprador").value,
                celularComprador: document.getElementById("celularComprador").value,
                nombreDestinatario: document.getElementById("nombreDestinatario").value,
                celularDestinatario: document.getElementById("celularDestinatario").value,
                direccionEntrega: document.getElementById("direccionEntrega").value,
                notasPedido: document.getElementById("notasPedido").value,
                mensajeTarjeta: document.getElementById("mensajeTarjeta").value,
                deTarjeta: document.getElementById("deTarjeta").value,
                paraTarjeta: document.getElementById("paraTarjeta").value,
                fechaEntrega: document.getElementById("fechaEntrega").value,
                horaEntrega: document.getElementById("horaEntrega").value
            };

            if (Object.values(campos).some(v => !v.trim())) {
                alert("⚠️ Por favor completa todos los campos.");
                return;
            }

            if (!idDomiciliarioAsignado) {
                alert("❌ Error: No hay domiciliarios en el sistema.");
                return;
            }

            btn.disabled = true;
            btn.innerText = "Enviando...";

            const pedidosRef = ref(db, `${empresaId}/Pedidos/${idDomiciliarioAsignado}`);
            
            onValue(pedidosRef, (snapshot) => {
                let maxPos = 0;
                snapshot.forEach(c => { if(c.val().posicion > maxPos) maxPos = c.val().posicion; });

                const nuevoRef = push(pedidosRef);
                const pedidoObj = {
                    idPedido: nuevoRef.key,
                    direccion: campos.direccionEntrega,
                    imagenUrl: imagenProducto,
                    cliente: campos.celularComprador,
                    nombreCliente: campos.nombreComprador,
                    referencia: productoSeleccionado,
                    adicional: document.getElementById("productoAdicional").value,
                    banco: campos.medioPago,
                    destinatario: campos.celularDestinatario,
                    nombreDestinatario: campos.nombreDestinatario,
                    de: campos.deTarjeta,
                    para: campos.paraTarjeta,
                    diaEntrega: campos.fechaEntrega,
                    horaEntrega: campos.horaEntrega,
                    mensaje: campos.mensajeTarjeta,
                    notas: campos.notasPedido,
                    posicion: maxPos + 1,
                    fechaRegistro: new Date().toLocaleDateString(),
                    horaRegistro: new Date().toLocaleTimeString(),
                    notificado: false,
                    color: ""
                };

                set(nuevoRef, pedidoObj).then(() => {
                    alert("✅ Pedido enviado correctamente continuamos por WhatsApp");
                    location.reload();
                });
            }, { onlyOnce: true });
        }

        // Utilidades
        window.cerrarModal = () => document.getElementById("modalPedido").style.display = "none";
        window.abrirProducto = abrirProducto;
        window.enviarPedido = enviarPedido;
        const formatearPrecio = (v) => "$" + v.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        const normalizarImagen = (url) => {
            if (url?.includes("drive.google.com")) {
                const id = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
                return id ? `https://drive.google.com/thumbnail?id=${id[1]}&sz=w1000` : url;
            }
            return url || "";
        };
    </script>
</body>
</html>
