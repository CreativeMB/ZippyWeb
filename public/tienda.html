<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tienda</title>

<style>

body{
font-family:Arial;
margin:0;
background:#f4f4f4;
color:#333;
}

.header{
text-align:center;
padding:30px 20px;
background:white;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.header h1{
margin:0;
font-size:28px;
}

.eslogan{
color:#666;
margin-top:5px;
}

.publicidad{
margin-top:15px;
background:#ffefc2;
padding:10px;
border-radius:8px;
font-weight:bold;
}

.productos{
padding:20px;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
gap:20px;
}

.producto{
background:white;
border-radius:10px;
box-shadow:0 2px 6px rgba(0,0,0,0.2);
padding:10px;
text-align:center;
}

.producto img{
width:100%;
height:180px;
object-fit:cover;
border-radius:8px;
display:block;
}

.nombre{
font-weight:bold;
margin:8px 0;
}

.precio{
color:green;
font-size:18px;
}

.precioViejo{
text-decoration:line-through;
color:#888;
font-size:14px;
}

.btn{
display:inline-block;
margin-top:8px;
background:#25D366;
color:white;
padding:8px 12px;
border-radius:6px;
text-decoration:none;
font-size:14px;
}

.footer{
background:#222;
color:white;
padding:30px 20px;
margin-top:40px;
}

.footer p{
margin:5px 0;
}

.credito{
margin-top:15px;
font-size:13px;
opacity:0.8;
}

.credito a{
color:#4fc3f7;
text-decoration:none;
}

</style>

</head>

<body>

<div class="header">

<h1 id="nombreEmpresa"></h1>
<div class="eslogan" id="eslogan"></div>

<div class="publicidad" id="publicidad"></div>

</div>

<div class="productos" id="productos"></div>

<div class="footer">

<p id="descripcion"></p>
<p id="direccion"></p>
<p id="ciudad"></p>
<p id="telefono"></p>
<p id="correo"></p>

<div class="credito">
Creado por 
<a href="https://zipy.carrd.co/" target="_blank">Zippy</a>
</div>

</div>


<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {

apiKey: "TU_API_KEY",
authDomain: "zippy-727d5.firebaseapp.com",
databaseURL: "https://zippy-727d5-default-rtdb.firebaseio.com",
projectId: "zippy-727d5"

};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let productosJson = {};
let productosRealtime = {};
let telefonoEmpresa = "";

const slug = window.location.pathname.split("/").pop();

buscarEmpresa();


function buscarEmpresa(){

const empresasRef = ref(db);

onValue(empresasRef,(snapshot)=>{

snapshot.forEach((child)=>{

const data = child.val();

if(data.perfilempresa?.slug === slug){

const empresaId = child.key;
const perfil = data.perfilempresa;

telefonoEmpresa = perfil.WhatsApp.replace("+","");

document.getElementById("nombreEmpresa").innerText = perfil.nombreEmpresa;
document.getElementById("eslogan").innerText = perfil.eslogan;
document.getElementById("publicidad").innerText = perfil.publicidad;

document.getElementById("descripcion").innerText = perfil.descripcionEmpresa;
document.getElementById("direccion").innerText = "Dirección: " + perfil.direccion;
document.getElementById("ciudad").innerText = "Ciudad: " + perfil.ciudad;
document.getElementById("telefono").innerText = "WhatsApp: " + perfil.WhatsApp;
document.getElementById("correo").innerText = "Correo: " + perfil.correo;

cargarProductosJSON(perfil.urljason);
escucharCambios(empresaId);

}

})

})

}


function cargarProductosJSON(url){

fetch(url)
.then(res=>res.json())
.then(data=>{

productosJson = data;
render();

})

}


function escucharCambios(empresaId){

const productosRef = ref(db, empresaId + "/productos");

onValue(productosRef,(snapshot)=>{

productosRealtime = {};

snapshot.forEach((child)=>{

const p = child.val();
productosRealtime[p.referencia] = p;

});

render();

})

}

function normalizarImagen(url){

if(!url) return "";

if(url.includes("drive.google.com")){

const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/[?&]id=([a-zA-Z0-9_-]+)/);

if(match && match[1]){
return `https://drive.google.com/thumbnail?id=${match[1]}&sz=w1000`;
}

}

return url;

}

function render(){

const contenedor = document.getElementById("productos");
contenedor.innerHTML="";

for(const refProducto in productosJson){

const imagen = productosJson[refProducto];
const realtime = productosRealtime[refProducto];

let precioHTML="";
let linkWhats="";

if(realtime){

let precio = realtime.valor;

if(realtime.promocion){

precioHTML=`
<div class="precio">${realtime.valorPromocion}</div>
<div class="precioViejo">${realtime.valor}</div>
`;

precio = realtime.valorPromocion;

}else{

precioHTML=`<div class="precio">$${realtime.valor}</div>`;

}

const mensaje = encodeURIComponent("Hola quiero comprar " + refProducto);

linkWhats=`https://wa.me/${telefonoEmpresa}?text=${mensaje}`;

}

contenedor.innerHTML+=`

<div class="producto">

<img src="${normalizarImagen(imagen)}" loading="lazy">

<div class="nombre">${refProducto}</div>

${precioHTML}

<a class="btn" href="${linkWhats}" target="_blank">
Comprar por WhatsApp
</a>

</div>

`;

}

}

</script>

</body>
</html>
