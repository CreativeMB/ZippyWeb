<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Tienda</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f4f6f8;
}

/* ENCABEZADO */

header{
background:linear-gradient(135deg,#1e88e5,#42a5f5);
color:white;
padding:18px;
text-align:center;
font-size:22px;
font-weight:bold;
}

/* PUBLICIDAD */

.publicidad{
width:100%;
background:#ff7043;
color:white;
text-align:center;
padding:12px;
font-weight:bold;
}

/* PRODUCTOS */

.productos{
padding:15px;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
gap:15px;
}

/* MOVIL 2 COLUMNAS */

@media(max-width:600px){

.productos{
grid-template-columns:repeat(2,1fr);
gap:10px;
padding:10px;
}

}

/* TARJETA PRODUCTO */

.producto{
background:white;
border-radius:10px;
box-shadow:0 2px 6px rgba(0,0,0,0.15);
padding:10px;
text-align:center;
opacity:0;
transform:translateY(20px);
transition:.4s;
}

.producto.visible{
opacity:1;
transform:translateY(0);
}

.img-container{
position:relative;
}

.producto img{
width:100%;
aspect-ratio:4/5;
object-fit:cover;
border-radius:8px;
cursor:pointer;
}

/* NOMBRE */

.nombre{
font-weight:bold;
margin-top:8px;
}

/* PRECIOS */

.precio{
color:#2e7d32;
font-size:18px;
font-weight:bold;
}

.precioViejo{
text-decoration:line-through;
color:#888;
font-size:14px;
}

/* BOTON */

.btn{
display:block;
background:#1e88e5;
color:white;
padding:8px;
border-radius:6px;
margin-top:8px;
text-decoration:none;
font-size:14px;
}

/* PROMO */

.etiquetaPromo{
position:absolute;
top:8px;
left:8px;
background:#e53935;
color:white;
padding:3px 6px;
font-size:12px;
border-radius:4px;
}

/* AGOTADO */

.etiquetaAgotado{
position:absolute;
top:8px;
right:8px;
background:#555;
color:white;
padding:3px 6px;
font-size:12px;
border-radius:4px;
}

.agotado img{
opacity:.5;
}

/* LOADER */

.loader{
text-align:center;
padding:40px;
}

/* MODAL */

.modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.5);
display:none;
align-items:center;
justify-content:center;
z-index:10;
}

.modal-contenido{
background:white;
width:95%;
max-width:420px;
border-radius:10px;
padding:15px;
max-height:90%;
overflow:auto;
}

.cerrar{
float:right;
font-size:22px;
cursor:pointer;
}

/* CABECERA PRODUCTO */

.cabeceraPedido{
display:flex;
gap:10px;
margin-bottom:10px;
}

.cabeceraPedido img{
width:90px;
height:110px;
object-fit:cover;
border-radius:6px;
}

.infoProducto{
flex:1;
}

.refProducto{
font-weight:bold;
font-size:16px;
}

.descripcionProducto{
font-size:13px;
color:#666;
margin-top:4px;
}

.precioModal{
font-size:18px;
color:#2e7d32;
margin-top:5px;
}

/* FORMULARIO */

.formulario input,
.formulario textarea,
.formulario select{
width:100%;
padding:8px;
margin-top:6px;
border:1px solid #ccc;
border-radius:6px;
font-size:14px;
}

.fila2{
display:flex;
gap:6px;
}

.formulario button{
background:#1e88e5;
color:white;
border:none;
padding:10px;
margin-top:10px;
border-radius:6px;
width:100%;
font-size:16px;
}

</style>
</head>

<body>

<header>Tienda</header>

<div class="publicidad">
Envíos en Bogotá hoy mismo
</div>

<div id="loader" class="loader">Cargando productos...</div>

<div id="productos" class="productos"></div>

<!-- MODAL -->

<div id="modalPedido" class="modal">

<div class="modal-contenido">

<span id="cerrarModal" class="cerrar">×</span>

<div class="cabeceraPedido">

<img id="productoImagen">

<div class="infoProducto">

<div id="productoTitulo" class="refProducto"></div>

<div id="productoDescripcion" class="descripcionProducto"></div>

<div id="productoPrecio" class="precioModal"></div>

</div>

</div>

<div class="formulario">

<input id="productoAdicional" placeholder="Producto adicional">

<select id="medioPago">
<option value="">Medio de pago</option>
<option>Nequi</option>
<option>Bancolombia</option>
<option>Daviplata</option>
<option>Efectivo</option>
</select>

<input id="nombreComprador" placeholder="Comprador">

<input id="celularComprador" placeholder="Número comprador">

<input id="direccionEntrega" placeholder="Dirección">

<textarea id="mensajeTarjeta" placeholder="Mensaje tarjeta"></textarea>

<input type="date" id="fechaEntrega">

<button id="enviarPedido">Enviar pedido</button>

</div>

</div>

</div>

<script>

/* TELEFONO EMPRESA */

const telefonoEmpresa="573000000000"

/* JSON PRODUCTOS (IMAGENES) */

const productosJson={
producto1:"https://drive.google.com/uc?export=view&id=1dN2dJSbkhShgUNZn-_d6H7IQY8Q4A0sB"
}

/* FIREBASE REALTIME */

const productosRealtime={}

/* FORMATEAR PRECIO */

function formatearPrecio(v){

return "$"+v.toLocaleString("es-CO")

}

/* NORMALIZAR IMAGEN */

function normalizarImagen(url){

if(!url) return ""

if(url.includes("drive.google.com")){

const id=url.split("id=")[1]

return "https://drive.google.com/thumbnail?id="+id+"&sz=w600"

}

return url

}

/* RENDER */

function render(){

const contenedor=document.getElementById("productos")
contenedor.innerHTML=""

for(const refProducto in productosJson){

const imagen=productosJson[refProducto]
const realtime=productosRealtime[refProducto]

if(!realtime) continue

let precioHTML=""
let etiquetaPromo=""
let etiquetaAgotado=""
let claseAgotado=""

let precio=realtime.valor

if(realtime.promocion){

precioHTML=`
<div class="precio">${formatearPrecio(realtime.valorPromocion)}</div>
<div class="precioViejo">${formatearPrecio(realtime.valor)}</div>
`

etiquetaPromo=`<div class="etiquetaPromo">PROMO</div>`
precio=realtime.valorPromocion

}else{

precioHTML=`<div class="precio">${formatearPrecio(realtime.valor)}</div>`

}

if(realtime.agotado){

etiquetaAgotado=`<div class="etiquetaAgotado">AGOTADO</div>`
claseAgotado="agotado"

}

const mensaje=encodeURIComponent("Hola quiero comprar "+refProducto)

const linkWhats=`https://wa.me/${telefonoEmpresa}?text=${mensaje}`

contenedor.innerHTML+=`

<div class="producto ${claseAgotado}">

<div class="img-container">

${etiquetaPromo}
${etiquetaAgotado}

<img src="${normalizarImagen(imagen)}">

</div>

<div class="nombre">${refProducto}</div>

${precioHTML}

${realtime.agotado ?
`<div class="btn" style="background:#999">Agotado</div>`
:
`<a class="btn" href="${linkWhats}" target="_blank">Comprar por WhatsApp</a>`
}

</div>

`

}

document.querySelectorAll(".producto").forEach((el,i)=>{

setTimeout(()=>{
el.classList.add("visible")
},i*80)

})

document.getElementById("loader").style.display="none"

}

/* DEMO DATOS */

productosRealtime["producto1"]={
valor:60000,
valorPromocion:50000,
promocion:true,
agotado:false,
descripcion:"chocolates jugá y mas"
}

render()

</script>

</body>
</html>
