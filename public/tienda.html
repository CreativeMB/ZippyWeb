<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tienda</title>

<style>

body{
font-family: Arial, sans-serif;
margin:0;
background:#f5f5f5;
}

.header{
background:#222;
color:white;
padding:20px;
text-align:center;
}

.productos-container{
padding:20px;
}

.productos-grid{

display:grid;
grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
gap:20px;

}

.producto{

background:white;
border-radius:10px;
overflow:hidden;
box-shadow:0 2px 6px rgba(0,0,0,0.2);
padding:10px;
text-align:center;

}

.producto img{

width:100%;
height:150px;
object-fit:cover;

}

.nombre{

font-size:16px;
font-weight:bold;
margin:10px 0;

}

.precio{

color:green;
font-size:18px;

}

.promocion{

background:red;
color:white;
padding:4px 6px;
font-size:12px;
border-radius:5px;

}

</style>

</head>


<body>

<header class="header">

<h1 id="nombreEmpresa">Tienda</h1>
<p id="eslogan"></p>

</header>


<section class="productos-container">

<div id="productos" class="productos-grid"></div>

</section>



<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {

 apiKey: "AIzaSyBTphfyjQbU1AKt6sYFepJ8Q8mGp3sbtOA",
    authDomain: "zippy-727d5.firebaseapp.com",
    databaseURL: "https://zippy-727d5-default-rtdb.firebaseio.com",
    projectId: "zippy-727d5",
storageBucket: "zippy-727d5.appspot.com",
messagingSenderId: "XXXX",
appId: "XXXX"

};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);


const slug = window.location.pathname.split("/").pop();

let empresaId = null;
let productos = {};

buscarEmpresa();



function buscarEmpresa(){

const empresasRef = ref(db);

onValue(empresasRef,(snapshot)=>{

snapshot.forEach((child)=>{

const data = child.val();

if(data.perfilempresa?.slug === slug){

empresaId = child.key;

document.getElementById("nombreEmpresa").innerText = data.perfilempresa.nombreEmpresa;
document.getElementById("eslogan").innerText = data.perfilempresa.eslogan;

cargarProductosJSON(data.perfilempresa.urljason);

escucharCambios();

}

})

})

}



function cargarProductosJSON(url){

fetch(url)
.then(res=>res.json())
.then(data=>{

productos = data;

mostrarProductos();

})

}



function escucharCambios(){

const productosRef = ref(db, empresaId + "/productos");

onValue(productosRef,(snapshot)=>{

snapshot.forEach((child)=>{

productos[child.key] = child.val();

})

mostrarProductos();

})

}



function mostrarProductos(){

const contenedor = document.getElementById("productos");

contenedor.innerHTML="";

for(const nombreProducto in productos){

const imagen = productos[nombreProducto];

contenedor.innerHTML += `

<div class="producto">

<img src="${imagen}">

<div class="nombre">${nombreProducto}</div>

</div>

`;

}

}

</script>

</body>

</html>
