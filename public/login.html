<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zippy - Ecosistema Digital</title>
  
  <link rel="stylesheet" href="css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Inter:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --android-bg: #0F172A;     /* Fondo Azul Oscuro */
      --card-bg: #1E293B;        /* Gris Pizarra */
      --zippy-orange: #FF9800;   /* Naranja Zippy */
      --btn-blue: #2563EB;       /* Azul Botón */
      --text-white: #FFFFFF;
      --text-gray: #9CA3AF;
    }

    body, html {
      margin: 0; padding: 0; height: 100%;
      background-color: var(--android-bg) !important;
      font-family: 'Inter', sans-serif;
      display: flex; justify-content: center; align-items: center;
    }

    .container { width: 100%; max-width: 420px; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; }

    /* TARJETA PRINCIPAL */
    .card {
      background-color: var(--card-bg);
      border-radius: 24px;
      padding: 40px 30px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
      color: var(--text-white);
    }

    .logo { width: 90px; height: 90px; margin-bottom: 20px; }

    .nombreEmpresa { 
      font-family: 'Montserrat', sans-serif;
      font-size: 24px;
      font-weight: 900; 
      margin: 0;
      text-transform: uppercase;
    }

    .nombreEmpresa span { color: var(--zippy-orange); }

    .subTitle { 
      font-size: 14px; 
      color: var(--text-gray); 
      margin: 15px 0 30px 0; 
      line-height: 1.5;
    }

    /* BOTÓN GOOGLE AZUL (ID para login.js) */
    #btnGoogle {
      width: 100%; height: 60px;
      background-color: var(--btn-blue);
      color: white; border: none; border-radius: 12px;
      font-size: 15px; font-weight: bold; text-transform: uppercase;
      cursor: pointer; transition: 0.3s;
    }

    /* ESTILO AVISO DESCARGA */
    .aviso-zippy {
      margin-top: 20px;
      padding: 25px;
      background-color: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      color: white;
      text-align: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }

    .aviso-zippy p { margin: 0 0 15px 0; font-size: 14px; font-weight: 400; line-height: 1.4; }

    /* EL BOTÓN NARANJA SOLICITADO */
    .btn-naranja {
      display: inline-block;
      width: 100%;
      padding: 14px 0;
      background-color: var(--zippy-orange);
      color: white !important;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
      font-size: 14px;
      text-transform: uppercase;
      transition: background 0.3s;
    }

    .btn-naranja:hover {
      background-color: #e68a00;
      transform: scale(1.02);
    }
  </style>

  <script defer src="https://www.gstatic.com/firebasejs/12.6.0/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/12.6.0/firebase-auth-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/12.6.0/firebase-database-compat.js"></script>

  <script defer src="js/init.js"></script>
  <script defer src="js/login.js"></script>
</head>
<body>

  <div class="container" id="container">
    <div class="card" id="cardLogin">
      <img src="img/icono.png" alt="Logo Zippy" class="logo">
      <h1 class="nombreEmpresa">Ecosistema Digital <span>Zippy</span></h1>
      
      <p class="subTitle">
        Toma el control total de tu negocio desde tu móvil. 
        Vende más, gestiona pedidos, contabilidad y domicilios con facilidad.
      </p>
      
      <button id="btnGoogle">Iniciar sesión con Google</button>
      <div id="error-message" style="color: #f87171; margin-top: 10px;"></div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const container = document.getElementById('container');
      const card = document.getElementById('cardLogin');

      function esDispositivoMovil() {
        return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
      }

      const usuarioTieneEmpresa = false; // Lógica real de tu app

      if (esDispositivoMovil()) {
        card.style.display = 'none';
        crearAviso("Estás en un dispositivo móvil. Para continuar, descarga nuestra app:");
      } 
      else if (!usuarioTieneEmpresa) {
        crearAviso("No tienes empresa registrada. Para crear una y continuar, usa nuestra app:");
      }

      function crearAviso(msg) {
        const div = document.createElement('div');
        div.className = 'aviso-zippy';
        div.innerHTML = `
          <p>${msg}</p>
          <a href="https://zipy.carrd.co/" target="_blank" class="btn-naranja">Descarga la app aquí</a>
        `;
        container.appendChild(div);
      }
    });
  </script>
</body>
</html>
