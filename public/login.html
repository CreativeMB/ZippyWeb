<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zippy - Ecosistema Digital</title>
  
  <style>
    :root {
      --android-bg: #0F172A;
      --card-bg: #1E293B;
      --btn-blue: #2563EB;
      --text-white: #FFFFFF;
      --text-gray: #9CA3AF;
      --text-legal: #64748B;
    }

    body, html {
      margin: 0; padding: 0; height: 100%;
      background-color: var(--android-bg);
      font-family: 'Inter', 'Segoe UI', sans-serif;
      display: flex; justify-content: center; align-items: center;
    }

    .container { width: 100%; max-width: 420px; padding: 20px; box-sizing: border-box; }

    /* TARJETA PRINCIPAL */
    .card {
      background-color: var(--card-bg);
      border-radius: 20px;
      padding: 35px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      color: var(--text-white);
    }

    .logo { width: 90px; height: 90px; margin-bottom: 16px; }
    .nombreEmpresa { font-size: 26px; font-weight: 800; margin: 0; }
    .subTitle { font-size: 14px; color: var(--text-gray); margin: 8px 0 30px 0; }

    /* BOTÓN AZUL ZIPPY */
    #btnGoogle {
      width: 100%; height: 60px;
      background-color: var(--btn-blue);
      color: white; border: none; border-radius: 12px;
      font-size: 15px; font-weight: bold; text-transform: uppercase;
      cursor: pointer; transition: 0.3s;
    }

    #btnGoogle:hover { background-color: #1d4ed8; transform: translateY(-2px); }

    /* ESTILO DE LOS AVISOS DE DESCARGA (Móvil y Sin Empresa) */
    .aviso-descarga {
      margin-top: 20px;
      padding: 20px;
      background-color: #1E293B; /* Mismo que la card */
      border: 1px solid var(--btn-blue); /* Borde azul para resaltar */
      border-radius: 15px;
      color: #FFFFFF;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .aviso-descarga p { margin: 10px 0; font-weight: bold; }
    
    .btn-descarga {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 20px;
      background-color: var(--btn-blue);
      color: white !important;
      text-decoration: none;
      border-radius: 8px;
      font-size: 14px;
    }

    .legal-box { margin-top: 25px; font-size: 10px; color: var(--text-legal); line-height: 1.4; }
  </style>
</head>
<body>

  <div class="container" id="container">
    <div class="card" id="cardLogin">
      <img src="img/icono.png" alt="Logo Zippy" class="logo">
      <h1 class="nombreEmpresa">Ecosistema Zippy</h1>
      <p class="subTitle">Administra tu negocio en un solo lugar</p>
      
      <button id="btnGoogle">INGRESAR AL SISTEMA</button>
      
      <div id="error-message" style="color: #f87171; margin-top: 10px; font-size: 12px;"></div>

      <div class="legal-box">
        <p>Zippy © 2026 - Gestión Profesional</p>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const container = document.getElementById('container');
      const card = document.getElementById('cardLogin');

      function esDispositivoMovil() {
        return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
      }

      // CAMBIAR SEGÚN TU LÓGICA REAL
      const usuarioTieneEmpresa = false; 

      if (esDispositivoMovil()) {
        // MODO MÓVIL: Ocultamos login y mostramos aviso de App
        card.style.display = 'none';
        crearAviso("Estás en un dispositivo móvil. Para continuar, descarga nuestra app:", "DESCARGAR APP");
      } 
      else if (!usuarioTieneEmpresa) {
        // MODO DESKTOP SIN EMPRESA: Mostramos login Y aviso abajo
        crearAviso("No tienes empresa registrada. Para crear una y continuar, usa nuestra app móvil:", "OBTENER ZIPPY");
      }

      function crearAviso(mensaje, textoBoton) {
        const div = document.createElement('div');
        div.className = 'aviso-descarga';
        div.innerHTML = `
          <p>${mensaje}</p>
          <a href="https://zippy-727d5.web.app/empresa" target="_blank" class="btn-descarga">${textoBoton}</a>
        `;
        container.appendChild(div);
      }
    });
  </script>
</body>
</html>
