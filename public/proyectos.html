<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative M | Portafolio de Proyectos Modernos</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #0a0e17; /* Fondo oscuro profundo moderno */
            --primary-blue: #00d2ff; /* Azul neón eléctrico sofisticado */
            --secondary-blue: #3a7bd5; /* Azul medio para degradados */
            --primary-orange: #ff9f43; /* Naranja neón suave, no chillón */
            --primary-green: #00cec9; /* Verde esmeralda sutil para Zippy */
            --text-main: #fcfcfc; /* Texto casi blanco */
            --text-muted: #a4b0be; /* Texto gris para descripciones */
            --card-bg: rgba(255, 255, 255, 0.03); /* Fondo translúcido tipo vidrio */
            --card-border: rgba(255, 255, 255, 0.08); /* Borde sutil */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
            font-family: 'Poppins', sans-serif; 
            overflow-x: hidden; 
        }

        /* Tipografía Especial para Títulos */
        h1, h2, h3 { font-family: 'Space Grotesk', sans-serif; font-weight: 700; }

        /* Cabecera / Hero */
        header {
            background: radial-gradient(circle at 10% 20%, rgba(0, 210, 255, 0.1) 0%, rgba(10, 14, 23, 1) 90%);
            padding: 100px 20px;
            text-align: center;
            border-bottom: 1px solid var(--card-border);
        }

        header h1 {
            font-size: 4rem;
            background: linear-gradient(135deg, var(--text-main) 0%, var(--primary-blue) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -2px;
            margin-bottom: 10px;
        }

        header p { font-size: 1.2rem; color: var(--text-muted); font-weight: 300; }

        /* Títulos de Sección con Efecto Neón */
        .section-title {
            text-align: center;
            margin: 80px 0 40px;
            font-size: 2.5rem;
            letter-spacing: -1px;
            color: var(--text-main);
        }

        .section-title.zippy-title {
            background: linear-gradient(135deg, var(--text-main) 30%, var(--primary-orange) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .section-title.others-title {
            background: linear-gradient(135deg, var(--text-main) 30%, var(--primary-blue) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Contenedores */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px 60px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
        }

        /* Tarjeta Estilo Glassmorphism / Neón sutil */
        .app-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 35px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid var(--card-border);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        /* Efecto de borde neón al hover - Zippy */
        .app-card.zippy-card {
            border-image: linear-gradient(135deg, var(--card-border) 80%, rgba(255, 159, 67, 0.5) 100%) 1;
        }

        .app-card.zippy-card:hover {
            border-image: linear-gradient(135deg, rgba(255, 159, 67, 0.3) 0%, rgba(0, 206, 201, 0.3) 100%) 1;
            box-shadow: 0 10px 40px rgba(255, 159, 67, 0.1);
            transform: translateY(-8px);
        }

        /* Efecto de borde neón al hover - Otros */
        .app-card.others-card {
            border-image: linear-gradient(135deg, var(--card-border) 80%, rgba(0, 210, 255, 0.5) 100%) 1;
        }

        .app-card.others-card:hover {
            border-image: linear-gradient(135deg, rgba(0, 210, 255, 0.3) 0%, rgba(58, 123, 213, 0.3) 100%) 1;
            box-shadow: 0 10px 40px rgba(0, 210, 255, 0.1);
            transform: translateY(-8px);
        }

        /* Iconos */
        .icon-box {
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin-bottom: 25px;
            border: 1px solid var(--card-border);
            transition: 0.3s;
        }

        .zippy-card .icon-box { color: var(--primary-orange); }
        .others-card .icon-box { color: var(--primary-blue); }

        .app-card h3 { font-size: 1.6rem; margin-bottom: 12px; letter-spacing: -0.5px; }
        .app-card p { font-size: 0.95rem; color: var(--text-muted); margin-bottom: 25px; line-height: 1.6; min-height: 70px; }

        /* Botón Estilo Neón */
        .btn-action {
            text-decoration: none;
            color: white;
            padding: 14px;
            border-radius: 16px;
            text-align: center;
            font-weight: 600;
            font-size: 0.95rem;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border: 1px solid transparent;
        }

        /* Botón Zippy (Naranja) */
        .zippy-card .btn-action {
            background: rgba(255, 159, 67, 0.1);
            border-color: rgba(255, 159, 67, 0.3);
            color: var(--primary-orange);
        }

        .zippy-card .btn-action:hover {
            background: rgba(255, 159, 67, 0.2);
            box-shadow: 0 0 15px rgba(255, 159, 67, 0.3);
        }

        /* Botón Otros (Azul) */
        .others-card .btn-action {
            background: rgba(0, 210, 255, 0.1);
            border-color: rgba(0, 210, 255, 0.3);
            color: var(--primary-blue);
        }

        .others-card .btn-action:hover {
            background: rgba(0, 210, 255, 0.2);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
        }

        /* Floating WhatsApp Moderno */
        .btn-whatsapp {
            position: fixed; bottom: 30px; right: 30px; width: 65px; height: 65px;
            background-color: #25d366; color: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 32px; box-shadow: 0 5px 20px rgba(0,0,0,0.4); z-index: 1000;
            transition: 0.3s;
        }

        .btn-whatsapp:hover { transform: rotate(10deg) scale(1.1); }

        footer { text-align: center; padding: 60px; color: var(--text-muted); border-top: 1px solid var(--card-border); font-size: 0.9rem;}

        @media (max-width: 600px) {
            header h1 { font-size: 2.8rem; }
            .section-title { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Creative M</h1>
        <p>Innovación Digital & Ecosistemas Móviles de Alto Rendimiento</p>
    </header>

    <h2 class="section-title zippy-title">Ecosistema Digital Zippy</h2>
    <div class="container" id="zippy-list">
        </div>

    <h2 class="section-title others-title">Otros Proyectos Destacados</h2>
    <div class="container" id="others-list">
        </div>

    <a href="https://wa.me/573150725566" class="btn-whatsapp" target="_blank">
        <i class="fa-brands fa-whatsapp"></i>
    </a>

    <footer>
        <p>© 2026 Creative M | Empujando los límites de la tecnología</p>
    </footer>

    <script>
        const zippyApps = [
            {
                name: "Zippy Principal",
                desc: "Gestión Integral para tu Negocio. La plataforma central para controlar tu empresa.",
                icon: "fa-rocket",
                link: "https://zippy-727d5.web.app/empresa",
                btn: "Abrir Plataforma"
            },
            {
                name: "Zippy Entregas",
                desc: "Optimiza y rastrea la logística de tus domicilios en tiempo real con eficiencia.",
                icon: "fa-truck-fast",
                link: "https://zippy-727d5.web.app/empresa",
                btn: "Ver Detalles"
            },
            {
                name: "Zippy Catálogo",
                desc: "Catálogo interactivo moderno para tu punto de venta. Potencia tu atención al cliente.",
                icon: "fa-store",
                link: "https://zippy-727d5.web.app/empresa",
                btn: "Ver Catálogo"
            }
        ];

        const otherApps = [
            {
                name: "FullTV",
                desc: "¡Disfruta del cine en casa con FullTV! La forma más fácil, rápida y económica.",
                icon: "fa-film",
                link: "https://github.com/CreativeMB/center/releases/download/apk/FullTV.apk",
                btn: "Descargar APK"
            },
            {
                name: "Galeria TV",
                desc: "Explora y reproduce tus archivos USB en la pantalla grande de tu TV con facilidad.",
                icon: "fa-usb",
                link: "https://github.com/CreativeMB/center/releases/download/apk/Galeria_TV_1.0.apk",
                btn: "Descargar APK"
            },
            {
                name: "Tienda Control",
                desc: "Eficiencia, organización y control total. La clave para el éxito empresarial moderno.",
                icon: "fa-gauge-high",
                link: "https://www.mediafire.com/folder/xtlg6z45j060l/Tienda_control",
                btn: "Descargar APK"
            },
            {
                name: "Comunidad IPUC",
                desc: "Recursos bíblicos, fe e instrucción basada en la infalible Palabra de Dios.",
                icon: "fa-book-bible",
                link: "https://play.google.com/store/apps/details?id=ipuc.santacecilia&hl=es_419",
                btn: "Play Store"
            },
            {
                name: "Floristería Los Lirios",
                desc: "Catálogo completo de arreglos florales con la mejor experiencia de usuario móvil.",
                icon: "fa-leaf",
                link: "https://play.google.com/store/apps/details?id=floristeria.loslirios&hl=es_419",
                btn: "Play Store"
            }

        ];

        function render(data, containerId, isZippy) {
            const container = document.getElementById(containerId);
            data.forEach(p => {
                const card = document.createElement('div');
                card.className = `app-card ${isZippy ? 'zippy-card' : 'others-card'}`;
                card.innerHTML = `
                    <div>
                        <div class="icon-box"><i class="fa-solid ${p.icon}"></i></div>
                        <h3>${p.name}</h3>
                        <p>${p.desc}</p>
                    </div>
                    <a href="${p.link}" class="btn-action" target="_blank">${p.btn}</a>
                `;
                container.appendChild(card);
            });
        }

        render(zippyApps, 'zippy-list', true);
        render(otherApps, 'others-list', false);
    </script>
</body>
</html>
